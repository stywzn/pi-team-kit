name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: toolbox smoke test
        run: |
          T="${RUNNER_TEMP:-/tmp}"
          printf '# hello\n\n| a | b |\n|---|---|\n| 1 | 2 |\n' > "$T/t.md"
          node bin/ptk.ts run md2pdf "$T/t.md" "$T/t.html" --html-only
          grep -q '<table>' "$T/t.html"
          printf 'console.log("listening 18799"); require("http").createServer((q, s) => s.end("ok")).listen(18799)\n' > "$T/server.cjs"
          # wait on a LOG line, not just the port: on Windows the log once stayed empty (0.3.3 and earlier)
          node bin/ptk.ts run bg start srv --cwd "$T" --wait-for "listening" --timeout 30 -- node server.cjs
          node bin/ptk.ts run bg logs srv | grep -q "listening 18799"
          node bin/ptk.ts run bg list
          node bin/ptk.ts run bg stop srv
          printf 'console.error("boom: missing config"); process.exit(3)\n' > "$T/bad.cjs"
          out=$(node bin/ptk.ts run bg start bad --cwd "$T" --timeout 10 --wait-for ready -- node bad.cjs 2>&1) && exit 1 || true
          echo "$out" | grep -q "boom: missing config"
          echo "bg reported the early exit with its reason"
      - name: demo repo
        run: |
          git config --global user.name ci && git config --global user.email ci@localhost
          node bin/ptk.ts demo "${RUNNER_TEMP:-/tmp}/ptk-demo"
          cd "${RUNNER_TEMP:-/tmp}/ptk-demo" && python3 -m unittest -q || python -m unittest -q
      - run: node bin/ptk.ts doctor
